name: CI
permissions: read-all

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The header requires C++20; verify it also works for consumers
        # compiling under C++23 (the command-line -std appends after the
        # .bazelrc one and the last flag wins).
        std: [c++20, c++23]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Build
        env:
          STD: ${{ matrix.std }}
        run: bazel build --cxxopt=-std="$STD" //...

      - name: Test
        env:
          STD: ${{ matrix.std }}
        run: bazel test --cxxopt=-std="$STD" //...

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Check Buildifier formatting
        run: bazel run //tools:buildifier_check
