name: Super-Linter
permissions: read-all

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write
    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to check changed files
          fetch-depth: 0
          persist-credentials: false

      # Step 2: Run Super-Linter
      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set your default branch (usually main or master)
          DEFAULT_BRANCH: main
          # Biome (tabs) and Prettier (spaces) disagree on JSON formatting
          # out of the box; Biome is the JSON authority here.
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_ALL_CODEBASE: true
